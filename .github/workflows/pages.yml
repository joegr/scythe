# Builds the static frontend and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SCYTHE_SERVER_URL  the Fly passthrough that commits cards and spans
#   SCYTHE_API_URL     optional local API (search index, training); defaults to http://localhost:8000
name: Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b && npx eslint src
      - run: npx vite build
        env:
          VITE_SERVER_URL: ${{ vars.SCYTHE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
