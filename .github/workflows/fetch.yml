# Article fetcher: a source issue labeled scythe:fetch (opened by the app with a URL) is read in
# headless Chromium, stripped to clean HTML and text, and committed as sources/<n>.md + .html.
name: Fetch article

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: scythe-fetch
  cancel-in-progress: false

jobs:
  fetch:
    if: contains(github.event.issue.labels.*.name, 'scythe:fetch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/fetcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/fetcher/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch, strip, write
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/fetcher/fetch.mjs
      - name: Commit
        working-directory: .
        run: |
          git add sources
          git diff --cached --quiet && exit 0
          git config user.name "scythe[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "source: ${{ github.event.issue.title }} (#${{ github.event.issue.number }})"
          for attempt in 1 2 3 4 5; do git pull --rebase --quiet && git push --quiet && exit 0; sleep $((attempt * 3)); done
          exit 1
